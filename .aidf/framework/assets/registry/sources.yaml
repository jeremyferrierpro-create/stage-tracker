    redistribution: allowed-with-attribution
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-31
    notes: |
      Cloned (shallow) and pinned with the owner's explicit authorization
      (HOST-0004). Master HEAD 2026-10-26; the 5.0.0 English standard is the
      security baseline referenced by SECURITY.md and the owasp-baseline
      knowledge seed. Attribution required (CC-BY-SA-4.0); indexed by
      reference.

  - id: typescript-handbook
