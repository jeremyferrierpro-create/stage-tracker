schemaVersion: 1
description: |
  Registry of external resources known to AIDF. A resource is only usable when
  its path, format, version/commit and licence have been verified. Resources
  whose licence or origin is unknown are BLOCKED for installation and remain
  index-only. Paths are resolved relative to the framework root, the project
  root, or the project's parent directory, in that order.

resources:
  - id: github-spec-kit
    name: GitHub Spec Kit
    kind: git
    origin: https://github.com/github/spec-kit
    license: MIT
    version: 1.2.6.dev0
    commit: ba7894dafb178da085347efe2bec69038e820d71
    localPath: ../resources/spec-kit
    include:
      - templates/**
      - scripts/**
      - docs/**
    exclude:
      - .git/**
      - node_modules/**
    redistribution: allowed
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-30
    notes: |
      Source clone present. The `specify` CLI is installed separately through uv
      (v1.2.3). The clone is newer than the CLI; AIDF records both and does not
      assume feature parity.

  - id: mattpocock-skills
    name: Matt Pocock Skills
    kind: git
    origin: https://github.com/mattpocock/skills
    license: MIT
    version: 1.3.2
    commit: a496f5513d4a4cf889bc48e189e579f4b0bdf6aa
    localPath: ../resources/skills
    include:
      - skills/engineering/**
    exclude:
      - .git/**
      - node_modules/**
    redistribution: allowed
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-30
    notes: |
      20 engineering skills discovered. AIDF indexes them and does not copy them
      into the project. Individual skills can be linked explicitly with
      `aidf skills link <id>` when the IDE cannot scan their location.

  - id: superpowers
    name: Superpowers (obra)
    kind: git
    origin: https://github.com/obra/superpowers
    license: MIT
    version: 7.0.1
    commit: 2ce8aa15d05bd57213e6f746f953aafb7ded7a8b
    localPath: ../resources/superpowers
    include:
      - skills/**
    exclude:
      - .git/**
      - node_modules/**
    redistribution: allowed
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-30
    notes: |
      15 skills discovered (brainstorming, TDD, systematic debugging, planning,
      verification, etc.). Indexed by reference; not duplicated.

  - id: agent-rules-books
    name: Agent Rules Books
    kind: git
    origin: https://github.com/mattpocock/agent-rules-books
    license: MIT
    version: 0.0.0-unversioned
    commit: a7d7649044505b9c377c8dca28d2d6a543bc7f8c
    localPath: ../resources/agent-rules-books
    include:
      - '*/**.md'
    exclude:
      - .git/**
    redistribution: allowed
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-30
    notes: |
      Condensed engineering rules derived from well-known books. Indexed as
      knowledge references. AIDF does not copy book text; it links to the
      summaries and records the repository commit.

  - id: dictionary-of-ai-coding
    name: Dictionary of AI Coding
    kind: git
    origin: https://github.com/mattpocock/dictionary-of-ai-coding
    license: unknown
    version: 0.0.0-unversioned
    commit: ed1ebed3975cba04ed5e74c6ca73659274beb754
    localPath: ../resources/dictionary-of-ai-coding
    include:
      - dictionary/**
    redistribution: unknown
    install: index-only
    status: BLOCKED
    verifiedAt: 2026-10-30
    notes: |
      No LICENSE file was found in the clone. The content is indexed for local
      reading only and must not be copied or redistributed until the licence is
      clarified by the owner.

  - id: jeremy-web-modules
    name: MODULES — cours développeur web (corpus privé)
    kind: corpus
    origin: local (owned by Jeremy Ferrier)
    license: proprietary-owner
    version: curriculum-2026
    localPath: resources/MODULES
    include:
      - '*.md'
      - '*.txt'
      - '*.pdf'
      - '*.docx'
      - '*.pptx'
      - '*.odt'
      - '**/*.md'
      - '**/*.txt'
      - '**/*.pdf'
      - '**/*.docx'
      - '**/*.pptx'
      - '**/*.odt'
    exclude:
      - STAGE/**
      - '**/node_modules/**'
      - '**/.git/**'
      - '**/vendor/**'
      - '**/.env*'
      - '**/*.pem'
      - '**/*.p12'
      - '**/*.crt'
      - '**/*.key'
      - '**/db/**'
    redistribution: no
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-31
    notes: |
      100% des cours de développeur web de l'auteur (algo, html_css, JavaScript,
      PHP, SQL, conception/Merise/UX, cahier des charges, CNIL/RGPD, gestion de
      projet, git, docker, linux, réseaux, hébergement, anglais, IA, stage).
      Intégration STRICTEMENT sélective et index-only : seuls les documents de
      cours (md/txt/pdf/docx/pptx/odt) sont indexés. Le projet d'entreprise
      STAGE/**, les node_modules et tout fichier de secret (.env*, *.pem, *.crt,
      *.key) sont exclus et ne sont jamais lus. Aucune redistribution.
      ~400 documents de cours indexés (les arborescences de TP/labs contenant du
      code et des secrets sont ignorées).

  - id: qoder-docs
    name: Qoder official documentation
    kind: reference
    origin: https://docs.qoder.com
    license: proprietary-documentation
    version: live
    redistribution: no
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-30
    notes: |
      Official capability reference used to build the Qoder adapter. Verified
      pages: /user-guide/rules, /extensions/skills, /extensions/hooks,
      /extensions/subagent, /cli/Skills.

  - id: owasp-asvs
    name: OWASP Application Security Verification Standard
    kind: git
    origin: https://github.com/OWASP/ASVS
    license: CC-BY-SA-4.0
    version: '5.0.0'
    commit: 9ccce0e3cf47abd6a412fc8a8deadd7fd6da501f
    localPath: ../resources/owasp-asvs
    include:
      - 5.0/en/**
      - 5.0/docs_en/**
      - README.md
      - LICENSE.md
    exclude:
      - .git/**
    redistribution: allowed-with-attribution
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-31
    notes: |
      Cloned (shallow) and pinned with the owner's explicit authorization
      (HOST-0004). Master HEAD 2026-10-26; the 5.0.0 English standard is the
      security baseline referenced by SECURITY.md and the owasp-baseline
      knowledge seed. Attribution required (CC-BY-SA-4.0); indexed by
      reference.

  - id: typescript-handbook
    name: TypeScript Handbook
    kind: reference
    origin: https://www.typescriptlang.org/docs/handbook/
    license: Apache-2.0
    version: live
    redistribution: no
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-30
    notes: |
      Official language reference. AIDF knowledge files summarise a small set of
      rules in their own words and link to the official source.
