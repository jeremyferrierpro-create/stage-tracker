      - node_modules/**
    redistribution: allowed
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-30
    notes: |
      20 engineering skills discovered. AIDF indexes them and does not copy them
      into the project. Individual skills can be linked explicitly with
      `aidf skills link <id>` when the IDE cannot scan their location.

