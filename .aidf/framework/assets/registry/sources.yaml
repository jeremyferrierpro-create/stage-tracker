    status: PRESENT
    verifiedAt: 2026-10-30
    notes: |
      Condensed engineering rules derived from well-known books. Indexed as
      knowledge references. AIDF does not copy book text; it links to the
      summaries and records the repository commit.

  - id: dictionary-of-ai-coding
    name: Dictionary of AI Coding
    kind: git
    origin: https://github.com/mattpocock/dictionary-of-ai-coding
    license: MIT
    licenseDeclaredBy: project-owner
    licenseDeclaredAt: 2026-11-21
    version: 0.0.0-unversioned
    commit: ed1ebed3975cba04ed5e74c6ca73659274beb754
    localPath: ../resources/dictionary-of-ai-coding
    include:
      - dictionary/**
    redistribution: allowed
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-30
    notes: |
      The clone contains no LICENSE file, but the project owner declared on
      2026-11-21 that the content is MIT licensed (Maciej Ciemborowicz). The
      declaration is recorded here; adding a LICENSE file to the clone remains
      recommended so automated licence checks stay honest.

  - id: jeremy-web-modules
    name: MODULES — cours développeur web (corpus privé)
    kind: corpus
    origin: local (owned by Jeremy Ferrier)
    license: proprietary-owner
    version: curriculum-2026
    localPath: resources/MODULES
    include:
      - '**/*'
    exclude:
      - STAGE/**
      - '**/node_modules/**'
      - '**/.git/**'
      - '**/vendor/**'
      - '**/.env*'
      - '**/*.pem'
      - '**/*.p12'
      - '**/*.crt'
      - '**/*.key'
      - '**/db/**'
      - '**/*.mp4'
      - '**/*.mov'
      - '**/*.avi'
      - '**/*.mkv'
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.iso'
      - '**/*.dmg'
      - '**/*.pkg'
      - '**/*.deb'
      - '**/*.exe'
      - '**/*.msi'
      - '**/*.zip'
      - '**/*.tar'
      - '**/*.tar.gz'
      - '**/*.tgz'
      - '**/*.7z'
      - '**/*.rar'
      - '**/*.sqlite'
      - '**/*.sqlite3'
      - '**/*.db'
      - '**/*.dll'
      - '**/*.so'
    redistribution: no
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-31
    notes: |
      100% des cours de développeur web de l'auteur (algo, html_css, JavaScript,
      PHP, SQL, conception/Merise/UX, cahier des charges, CNIL/RGPD, gestion de
      projet, git, docker, linux, réseaux, hébergement, anglais, IA, stage).
      Intégration STRICTEMENT sélective et index-only : seuls les documents de
      cours (md/txt/pdf/docx/pptx/odt) sont indexés. Le projet d'entreprise
      STAGE/**, les node_modules et tout fichier de secret (.env*, *.pem, *.crt,
      *.key) sont exclus et ne sont jamais lus. Aucune redistribution.
      ~400 documents de cours indexés (les arborescences de TP/labs contenant du
      code et des secrets sont ignorées).

