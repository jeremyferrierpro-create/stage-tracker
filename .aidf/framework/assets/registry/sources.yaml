  - id: agent-rules-books
    name: Agent Rules Books
    kind: git
    origin: https://github.com/mattpocock/agent-rules-books
    license: MIT
    version: 0.0.0-unversioned
    commit: a7d7649044505b9c377c8dca28d2d6a543bc7f8c
    localPath: ../resources/agent-rules-books
    include:
      - '**/*'
    exclude:
