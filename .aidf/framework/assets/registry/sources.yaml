schemaVersion: 1
description: |
  Registry of external resources known to AIDF. A resource is only usable when
  its path, format, version/commit and licence have been verified. Resources
  whose licence or origin is unknown are BLOCKED for installation and remain
  index-only. Paths are resolved relative to the framework root, the project
  root, or the project's parent directory, in that order.

resources:
  - id: github-spec-kit
    name: GitHub Spec Kit
    kind: git
    origin: https://github.com/github/spec-kit
    license: MIT
    version: 1.2.6.dev0
    commit: ba7894dafb178da085347efe2bec69038e820d71
    localPath: ../resources/spec-kit
    include:
      - '**/*'
    exclude:
      - .git/**
      - node_modules/**
    redistribution: allowed
    install: reference
    status: PRESENT
    verifiedAt: 2026-10-30
    notes: |
      Source clone present. The `specify` CLI is installed separately through uv
      (v1.2.3). The clone is newer than the CLI; AIDF records both and does not
      assume feature parity.

  - id: mattpocock-skills
    name: Matt Pocock Skills
