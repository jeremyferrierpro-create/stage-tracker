name: stage-tracker

services:
  postgres:
    image: postgres:16-alpine
    container_name: stage-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-stage_tracker}
      POSTGRES_USER: ${DB_USERNAME:-stage_tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-stage_tracker} -d ${DB_DATABASE:-stage_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stage-tracker-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-stage_tracker}
      DB_USERNAME: ${DB_USERNAME:-stage_tracker}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: stage-tracker-pgdata